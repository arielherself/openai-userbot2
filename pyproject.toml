[project]
name = "openai-userbot2"
version = "0.1.0"
description = "A Telegram userbot whose replies come from a local headless-harness agent"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # the headless-harness server imports requests; the integration test runs it
    "requests>=2.31",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: drives a real headless-harness server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Every step that talks to Telegram or to the harness funnels its errors into one
# log line and keeps the turn alive, so catching broadly is the point there.
ignore = ["BLE001"]
